name: "Homebrew: Windows installer (Vulkan)"

# The unsigned Windows installer of this personal build. Nothing is published:
# the installer is an artifact of the run.
#
# Two ways to start it:
# - Push to the branch `build/homebrew-installer` (for example, create that
#   branch from `homebrew` in the GitHub web interface). This works while
#   `main`, the default branch, stays identical to the base project.
# - "Run workflow" in the Actions tab. GitHub offers that button only for
#   workflows on the default branch, so it appears once `homebrew` is made the
#   default branch.
on:
  workflow_dispatch:
  push:
    branches:
      - build/homebrew-installer

permissions:
  contents: read

concurrency:
  group: homebrew-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NEXT_TELEMETRY_DISABLED: "1"
  PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: "false"

jobs:
  build:
    name: Build unsigned installer (x64, Vulkan)
    # Pinned: this image ships Visual Studio 2022 and 7-Zip.
    runs-on: windows-2022
    # Each long step has its own limit as well, so that a stalled tool costs
    # minutes. The first run sat in a download for three hours.
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Pinned to the version this branch is built and tested with on Linux.
      # Rust 1.100 changed the layout of cargo's build folder, which the
      # build scripts of some pinned dependencies derive paths from.
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: homebrew-windows-vulkan-v2
          # A retry after a late failure does not recompile everything.
          cache-on-failure: true

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      # The build machine's own LLVM is newer than 18, the version the base
      # project generates the whisper.cpp bindings with. The script passes
      # the folder to the build as MEETILY_LLVM_DIR.
      - name: Install LLVM 18
        shell: pwsh
        timeout-minutes: 15
        run: ./frontend/scripts/install-llvm18-windows.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'llvm-18')

      - name: Build the installer
        shell: pwsh
        timeout-minutes: 120
        run: ./frontend/scripts/build-homebrew-windows.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: meetily-homebrew-windows-x64-vulkan
          path: dist-homebrew/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Meetily Homebrew: Windows installer (Vulkan, unsigned)"
            echo ""
            echo '```'
            cat dist-homebrew/SHA256SUMS.txt
            echo '```'
            echo ""
            echo "Download the artifact \`meetily-homebrew-windows-x64-vulkan\` from this run."
          } >> "$GITHUB_STEP_SUMMARY"

      # After the upload, so that a failure here leaves the installer
      # downloadable. Installs it on this machine, checks the install folder,
      # starts the app until its database exists, and removes it again.
      - name: Smoke test (install, start, folders)
        shell: pwsh
        timeout-minutes: 15
        run: ./frontend/scripts/smoke-test-homebrew-windows.ps1
