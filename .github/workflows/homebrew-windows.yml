name: "Homebrew: Windows installer (Vulkan)"

# The unsigned Windows installer of this personal build. Nothing is published:
# the installer is an artifact of the run.
#
# Two ways to start it:
# - Push to the branch `build/homebrew-installer` (for example, create that
#   branch from `homebrew` in the GitHub web interface). This works while
#   `main`, the default branch, stays identical to the base project.
# - "Run workflow" in the Actions tab. GitHub offers that button only for
#   workflows on the default branch, so it appears once `homebrew` is made the
#   default branch.
on:
  workflow_dispatch:
  push:
    branches:
      - build/homebrew-installer

permissions:
  contents: read

concurrency:
  group: homebrew-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NEXT_TELEMETRY_DISABLED: "1"
  PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: "false"

jobs:
  build:
    name: Build unsigned installer (x64, Vulkan)
    # Pinned: this image ships Visual Studio 2022. The build script fetches
    # LLVM 18 (needed for the whisper.cpp bindings) if the image has another.
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: homebrew-windows-vulkan-v1

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build the installer
        shell: pwsh
        env:
          # Lets the LLVM bootstrap script download from GitHub if the image's LLVM is not version 18.
          GH_TOKEN: ${{ github.token }}
        run: ./frontend/scripts/build-homebrew-windows.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: meetily-homebrew-windows-x64-vulkan
          path: dist-homebrew/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Meetily Homebrew: Windows installer (Vulkan, unsigned)"
            echo ""
            echo '```'
            cat dist-homebrew/SHA256SUMS.txt
            echo '```'
            echo ""
            echo "Download the artifact \`meetily-homebrew-windows-x64-vulkan\` from this run."
          } >> "$GITHUB_STEP_SUMMARY"

      # After the upload, so that a failure here leaves the installer
      # downloadable. Installs it on this machine, checks the install folder,
      # starts the app until its database exists, and removes it again.
      - name: Smoke test (install, start, folders)
        shell: pwsh
        run: ./frontend/scripts/smoke-test-homebrew-windows.ps1
